[package]
name = "zephyr"
version = "0.2.1"
description = "Zephyr - A modern file explorer powered by Zyra"
authors = ["AndreaPallotta"]
edition = "2021"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
zip = "2.2"
